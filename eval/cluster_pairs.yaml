# 题簇成对评测集（cluster pairs）
#
# 用途：给 report/canonical 使用的 SimHash + 2-gram Jaccard 聚类提供固定、可复跑的
# Precision / Recall / F1 基线（mianjing_kb.eval_cluster）。
#
# 标注口径：
#   same: true  = 两段文本问的是**同一个问题**（措辞/标点/语序不同也算同一题）
#   same: false = 问的是**不同问题**（即使共享关键词、同属一个知识点）
#   kind:
#     normalize  = 只差空格/标点/大小写/题号前缀，规范化后应完全一致
#     paraphrase = 真实改写（同义词、语序、口语化），是聚类召回的主要难点
#     hard_neg   = 词面高度相近但问的是不同问题（误合并的主要风险）
#     long_noise = 整段试卷/答案正文 vs 单题，用于检验长文本是否污染聚类
#
# review_state: reviewed —— 2026-11-21 已逐条人工复核 60 对：59 对标注无误；
# L02（题干+答案长文本 vs 纯题干）按 long_noise 长文本污染检验目的保留 same:false。
# 复核口径：每条确认 a/b 是否同题；有争议条目按口径删除，不靠调阈值迁就。
meta:
  name: 题簇成对评测集
  version: 1
  created: 2026-11-19
  review_state: reviewed
  labeled_by: seed
  reviewed_at: 2026-11-21
  reviewed_by: human
  target_pairs: 60

