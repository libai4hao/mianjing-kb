name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-deps:
    # 只验证依赖可解析 + 包可导入：证明 pywin32 的平台标记没把 Linux 安装拖死。
    # 不跑 pytest（测试与 Word COM/Windows 路径强相关，正式回归在 windows-latest）。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖（Linux）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: 包可导入（不得顶层依赖 win32com）
        run: python -c "import mianjing_kb.cli, mianjing_kb.search, mianjing_kb.llm_client"

  test:
    # 顶层 win32com / Word COM 只在 Windows 有意义；测试里也直接依赖 pywin32
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: 安装依赖（含平台标记的 pywin32）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
          python -m pip install -e . --no-deps

      - name: ruff
        run: python -m ruff check mianjing_kb tests

      - name: pytest
        run: python -m pytest tests -q

      - name: 隐私门禁（已跟踪文件）
        run: python -m mianjing_kb.privacy_scan

      - name: 端到端 demo（合成语料，不碰生产库）
        run: python -m mianjing_kb.demo --work "${{ runner.temp }}\kb-demo"
