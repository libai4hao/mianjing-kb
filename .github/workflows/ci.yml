name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 顶层 win32com / Word COM 只在 Windows 有意义；测试里也直接依赖 pywin32
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: 安装依赖（含平台标记的 pywin32）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
          python -m pip install -e . --no-deps

      - name: ruff
        run: python -m ruff check mianjing_kb tests

      - name: pytest
        run: python -m pytest tests -q

      - name: 隐私门禁（已跟踪文件）
        run: python -m mianjing_kb.privacy_scan

      - name: 端到端 demo（合成语料，不碰生产库）
        run: python -m mianjing_kb.demo --work "${{ runner.temp }}\kb-demo"
