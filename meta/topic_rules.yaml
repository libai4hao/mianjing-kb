# 文件名 → topic 规则（顺序敏感，先专后泛）
# 来源：语料内 21-面经数据库/tools/inventory.py 的 TOPIC_BY_TITLE（30 条），
# 这里外置为配置，便于新增领域时不用改代码。
# 命中即定，且 topic_source 记为 l1_title。

version: 1
rules:
  - {re: "MongoDB|MongDB",              topic: MongoDB}
  - {re: "MyBatis|Mybatis",             topic: MyBatis}
  - {re: "SpringBoot|springboot",       topic: SpringBoot}
  - {re: "SpringCloud|springcloud|微服务", topic: SpringCloud}
  - {re: "SpringMVC|Spring MVC",        topic: SpringMVC}
  - {re: "Spring(?!Boot|Cloud)",        topic: Spring}
  - {re: "Tomcat",                      topic: Tomcat}
  - {re: "Dubbo|dubbo",                 topic: Dubbo}
  - {re: "Zookeeper|ZooKeeper",         topic: Zookeeper}
  - {re: "Nginx",                       topic: Nginx}
  - {re: "RabbitMQ",                    topic: RabbitMQ}
  - {re: "Kafka|kafka",                 topic: Kafka}
  - {re: "RocketMq|RocketMQ",            topic: RocketMQ}
  - {re: "Netty",                       topic: Netty}
  - {re: "ElasticSearch",               topic: ElasticSearch}
  - {re: "Memcache|memcached",          topic: Memcached}
  - {re: "ActiveMQ",                    topic: ActiveMQ}
  - {re: "Redis|redis",                 topic: Redis}
  - {re: "MySQL|Mysql|mysql|数据库|索引|SQL", topic: MySQL}
  - {re: "JVM|Java虚拟机",               topic: JVM}
  - {re: "并发|多线程|线程|JUC|AQS|锁",    topic: 并发编程}
  - {re: "Linux",                       topic: Linux}
  - {re: "TCP|UDP|Http|Socket|计算机网络|网络", topic: 计算机网络}
  - {re: "操作系统",                     topic: 操作系统}
  - {re: "算法|LeetCode|剑指|数据结构|刷题", topic: 算法}
  - {re: "设计模式",                     topic: 设计模式}
  - {re: "分布式",                       topic: 分布式}   # 兜底位：置于具体组件词（Zookeeper/Kafka/SpringCloud微服务等）之后，防抢命中
  - {re: "docker|Docker",               topic: Docker}

# 只作用在【文件名】上的岗位/技术栈词（不进 _is_topic_like：否则 "阿里笔试非技术岗" 这类
# 来源目录会被当成主题词剔掉，collection 退化到上一级）。命中仍记 topic_source=l1_title。
title_only_rules:
  - {re: '前端|React|Vue|Angular|CSS|HTML|JavaScript|TypeScript|小程序', topic: 前端}
  - {re: 'C\+\+|C语言|C#|CSharp',         topic: C++}
  - {re: 'Python|Django|Flask',          topic: Python}
  - {re: '运维|DevOps|Kubernetes|K8s',    topic: 运维}
  - {re: '大数据|Hadoop|Spark|Flink|Hive|数据开发', topic: 大数据}
  - {re: '测试|测开|QA|自动化测试',          topic: 软件测试}
  - {re: '产品|运营|销售|人力|行政|财务|投资|金融|市场|管培|非技术', topic: 非技术}
  - {re: 'Java|JAVA',                     topic: Java基础}

# 只在"目录名"上匹配的知识词典（比文件名保守，避免"网络版"这种包装词误判）
# 顶层目录名 → topic 的强映射（语料现网 12 个主题目录）
folder_topics:
  01-Java基础: Java基础
  02-JVM: JVM
  03-并发编程: 并发编程
  04-MySQL与数据库: MySQL
  05-Redis: Redis
  06-Spring框架: Spring
  07-消息队列与分布式: 消息队列
  08-计算机网络与操作系统: 计算机网络
  09-算法与数据结构: 算法
  10-设计模式与架构: 设计模式
  12-综合题库: 未分类
