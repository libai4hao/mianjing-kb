# 标签维度定义（T21）——prompt 与 G6 的唯一来源
# kind: enum 单选 / enum_multi 多选 / int 整数 / text 文本 / open_tags 开放标签
# required: 打标要求；G6 只能校验"已有值是否合法"，覆盖率进 detail（历史行没有这些列）
version: 1

fields:
  topic:
    kind: enum
    source: topic_vocab        # meta/topic_rules.yaml 并集，「其他」兜底
    required: true
    max_len: 40
  qtype:
    kind: enum
    values: [八股, 算法, HR, 场景, 项目]
    required: true
  difficulty:
    kind: int
    min: 1
    max: 5
    required: true
  position:
    kind: enum_multi
    values: [后端, 前端, 算法, 测试, 客户端, 数据, 其他]
    max_items: 2
    required: false
  quality:
    kind: enum_multi
    values: [重复, 残缺, 过时, 广告, 无答案]
    max_items: 3
    required: false
  canonical_q:
    kind: text
    max_len: 60
    required: true
  tags:
    kind: open_tags
    min_items: 0               # prompt 要求 3~8，G6 不因少于 3 判不合格
    max_items: 8
    max_len: 24
